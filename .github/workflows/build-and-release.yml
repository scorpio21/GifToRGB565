name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (ej. 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || '1.1.0' }}
      APP_NAME: GifRGB565GUI
      PROJECT_FILE: GifRGB565GUI/GifRGB565GUI.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        shell: pwsh
        run: |
          if ("${{ startsWith(github.ref, 'refs/tags/v') }}" -eq 'True') {
            $version = "${{ github.ref_name }}".Substring(1)
          } else {
            $version = "${{ env.RELEASE_VERSION }}"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_FILE }}

      - name: Publish single-file win-x64
        run: >
          dotnet publish ${{ env.PROJECT_FILE }} -c Release -r win-x64 --self-contained true
          /p:PublishSingleFile=true /p:PublishTrimmed=false -o publish/win-x64

      - name: Crear ZIP portable
        shell: pwsh
        run: |
          $version="${{ env.RELEASE_VERSION }}"
          Compress-Archive -Force publish/win-x64/* publish/${{ env.APP_NAME }}_${version}_win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseFiles
          path: |
            publish/${{ env.APP_NAME }}_*_win-x64.zip
          retention-days: 1

      - name: Preparar changelog
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref,'refs/tags/v')
        shell: pwsh
        run: |
          $version="${{ env.RELEASE_VERSION }}"
          $c=Get-Content CHANGELOG.md
          $m=$c|Select-String "## [$version]" -SimpleMatch|Select-Object -First 1
          if(!$m){$m=$c|Select-String "## v$version" -SimpleMatch|Select-Object -First 1}
          if(!$m){exit 1}

          $start=$m.LineNumber-1
          $rest=$c[$start..($c.Length-1)]
          $next=$rest|Select-String '^## ' | Select-Object -Skip 1 -First 1

          if($next){
            $slice=$rest[0..($next.LineNumber-2)]
          }else{
            $slice=$rest
          }

          Set-Content CHANGELOG_RELEASE.md $slice

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref,'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: GifRGB565GUI v${{ env.RELEASE_VERSION }}
          body_path: CHANGELOG_RELEASE.md
          files: |
            publish/${{ env.APP_NAME }}_*_win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
